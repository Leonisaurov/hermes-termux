name: Termux standalone release

# Builds the Hermes Agent standalone binary (Nuitka) for Android/Termux
# inside a real Termux container, on a native arm64 runner — the same
# architecture as the target device. On tag pushes (v*) the tarball is
# published as a GitHub Release; manual runs only upload an artifact.
#
# Why this shape:
#   * termux/termux-docker:latest is a multi-arch Termux rootfs (bionic
#     libc + Termux package manager). On ubuntu-24.04-arm Docker pulls the
#     arm64 variant natively — no QEMU, no proot, `pkg` works as on-device.
#   * scripts/build-termux-standalone-ci.sh drives the exact same setup
#     script used on-device (scripts/setup_termux.sh --standalone), so a
#     green CI build is the same artifact a phone would produce.
#   * The container's default user is `system` (uid 1000); the checkout is
#     chowned to it so the venv + dist/ can be written from inside.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release with the standalone binary (tag = ci-<run-id>)
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release for tag pushes

concurrency:
  group: termux-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Hermes standalone (aarch64)
    # Public arm64 runner — native architecture, no emulation. If this
    # label is unavailable on the account, replace with ubuntu-latest +
    # QEMU (docker run --platform linux/arm64) at the cost of speed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Make checkout writable by container user
        # termux-docker runs as uid 1000 (Android `system`); the checkout
        # is owned by the runner (uid 1001). The venv and dist/ are created
        # inside the checkout by the container, so hand it over first.
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Expand memory (zram + large swap file)
        # The Nuitka final link (all 3590 objects in a single lld invocation)
        # is memory-hungry; extra swap gives the linker headroom and prevents
        # spurious OOM kills on a busy runner. (LTO now uses ThinLTO via
        # --experimental=thin-lto — see setup_termux.sh — because full LTO
        # OOM-killed lld even with 16G extra swap. The swap here is still a
        # cheap safety net for the ThinLTO link.)
        #
        # Two facts rule the shape of this step:
        #   * GitHub public arm64 runners ship WITHOUT a zram module
        #     (modprobe fails), but WITH a small default swap (~3G) already
        #     active. An "if no swap exists, create one" guard therefore
        #     never fires and the build OOMs.
        #   * The arm64 runner disk is small (~14G), so a fixed 8G/16G swap
        #     file can fill the disk. Size the file to what actually fits,
        #     capped at 16G, and ALWAYS create it on top of any existing
        #     swap. Best-effort: if neither zram nor the file works, the
        #     build still runs (just with less memory headroom).
        run: |
          if sudo modprobe zram 2>/dev/null; then
            echo "zram module available"
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null
            sudo mkswap /dev/zram0 >/dev/null 2>&1 && sudo swapon /dev/zram0 && echo "zram swap enabled"
          fi
          # Always add a swap file on top of any existing swap. Size it to
          # fit on disk with ~2G headroom for the build, capped at 16G.
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          size_mb=$(( (avail_kb - 2097152) / 1024 ))
          [ "$size_mb" -gt 16384 ] && size_mb=16384
          if [ "$size_mb" -gt 1024 ]; then
            echo "creating ${size_mb}MB swap file"
            # Use a distinct path: the runner's default ~3G swap already
            # occupies /swapfile (active), so overwriting it fails with
            # "Text file busy". Add ours as a second swap on top.
            sudo fallocate -l "${size_mb}M" /buildswap 2>/dev/null || sudo dd if=/dev/zero of=/buildswap bs=1M count="$size_mb" status=none
            sudo chmod 600 /buildswap
            sudo mkswap /buildswap >/dev/null
            sudo swapon /buildswap && echo "swap file enabled (${size_mb}MB)"
          else
            echo "insufficient disk for a useful swap file (${size_mb}MB available); skipping"
          fi
          free -h

      - name: Restore Nuitka + pip build cache
        # Nuitka keeps a per-module compile cache (~/.cache/Nuitka, explicit
        # --cache-dir) and ccache keeps object files; pip keeps built wheels
        # (~/.cache/pip). Persisting all three across runs turns a ~40 min
        # cold compile into a ~5 min incremental one when only a few .py
        # files changed (Nuitka recompiles only stale modules; its cache
        # self-invalidates when the Nuitka/compiler version changes).
        #
        # Key only on dependency manifests, NOT on scripts/*.sh or source
        # .py files: a pure source change must hit the same key and restore
        # the previous compile cache so Nuitka recompiles just the changed
        # modules. Script changes (build flow) should not nuke the cache.
        id: cache-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/hermes-termux-cache
          key: hermes-termux-cache-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            hermes-termux-cache-

      - name: Prepare cache dir for container
        run: |
          mkdir -p "${{ runner.temp }}/hermes-termux-cache"/pip
          mkdir -p "${{ runner.temp }}/hermes-termux-cache"/nuitka
          mkdir -p "${{ runner.temp }}/hermes-termux-cache"/ccache
          sudo chown -R 1000:1000 "${{ runner.temp }}/hermes-termux-cache"

      - name: Build inside Termux container (arm64)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -v "${{ runner.temp }}/hermes-termux-cache/pip:/data/data/com.termux/files/home/.cache/pip" \
            -v "${{ runner.temp }}/hermes-termux-cache/nuitka:/data/data/com.termux/files/home/.cache/Nuitka" \
            -v "${{ runner.temp }}/hermes-termux-cache/ccache:/data/data/com.termux/files/home/.cache/ccache" \
            -e CCACHE_DIR=/data/data/com.termux/files/home/.cache/ccache \
            termux/termux-docker:latest \
            bash /workspace/scripts/build-termux-standalone-ci.sh

      - name: Restore checkout ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Save Nuitka + pip build cache
        # Always save (even on failure): a partially-populated Nuitka cache
        # still makes the next run faster, and pip wheels are pure win.
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/hermes-termux-cache
          # Suffix with run_id so every run writes a fresh entry; the next
          # run's restore-keys (prefix match) picks up the newest.
          key: hermes-termux-cache-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.run_id }}

      - name: Upload standalone artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-termux-aarch64
          path: dist/hermes-termux-*.tar.xz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download standalone artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermes-termux-aarch64
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@d1e66170d32c9ec7bbcb7fae044d3d686ce304d3 # v3.0.2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_id) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Hermes Termux CI build {0}', github.run_id) }}
          files: release-assets/hermes-termux-*.tar.xz
          generate_release_notes: startsWith(github.ref, 'refs/tags/v')
          # Tag pushes (v*) are stable releases and become "latest"; manual
          # workflow_dispatch builds are prereleases so they never shadow the
          # latest stable release (install.sh installs releases/latest).
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
